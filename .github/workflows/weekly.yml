name: weekly-update

on:
  schedule:
    - cron: "0 6 * * 2"   # Tuesdays 06:00 UTC, after the weekend round
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Fetch, backtest, rebuild report
        env:
          MPLBACKEND: Agg
        run: |
          pythia fetch
          pythia build
          pythia report

      - name: Commit refreshed artefacts
        run: |
          git config user.name "pythia-pl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A reports docs README.md README.en.md || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
